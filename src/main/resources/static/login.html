<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 400px;
            max-width: 90%;
        }
        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .error-msg {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .welcome-container {
            display: none;
            text-align: center;
        }
        .welcome-container h2 {
            color: #27ae60;
            margin-bottom: 15px;
        }
        .welcome-container p {
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }
        .btn-logout {
            padding: 10px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-logout:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 登录表单 -->
        <div id="loginForm">
            <h2>用户登录</h2>
            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" placeholder="请输入账号" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button class="btn-login" onclick="login()">登 录</button>
            <div class="error-msg" id="errorMsg"></div>
            <div class="register-link">
                还没有账号？<a href="register.html">立即注册</a>
            </div>
        </div>

        <!-- 登录成功欢迎页 -->
        <div id="welcomePage" class="welcome-container">
            <h2>🎉 登录成功！</h2>
            <p id="welcomeMsg"></p>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <script>
        // 回车键触发登录
        document.getElementById('password').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') login();
        });
        document.getElementById('username').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        function login() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                errorMsg.textContent = '请输入账号和密码';
                return;
            }

            errorMsg.textContent = '';

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.code === 0) {
                    // 登录成功
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('welcomePage').style.display = 'block';
                    document.getElementById('welcomeMsg').textContent = '欢迎回来，' + username + '！';
                } else if (data.code === 2) {
                    // 账号不存在
                    errorMsg.innerHTML = '账号不存在，请先 <a href="register.html" style="color:#667eea;font-weight:600;">注册</a>';
                } else {
                    // 密码错误
                    errorMsg.textContent = data.message || '密码错误，请重新输入';
                }
            })
            .catch(function(err) {
                errorMsg.textContent = '登录失败，请稍后重试';
            });
        }

        function logout() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('welcomePage').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('errorMsg').textContent = '';
        }
    </script>
</body>
</html>
